sections:
  - id: districts
    title: Округа и районы
    image: districts.jpg
    description: Здания, улицы и целые кварталы исчезают, но их историю можно восстановить по фотографиям, картам и документам. Исследуем причины сносов, судьбы архитектурных памятников и то, как утрата отдельных объектов меняла облик Москвы.
    cards:
      - topic: zamoskvorechye
        title: Замоскворечье
        description: Тихие переулки за Москвой-рекой. Как район сохранял свой уклад, пока на другом берегу вырастала новая столица?
      - topic: sokolniki
        title: Сокольники
        description: Когда-то здесь были леса, а сегодня — оживлённые улицы. История того, как окраина постепенно стала частью большого города.
      - topic: basmanny
        title: Басманный район
        description: Купеческие дома и старые слободы. Как складывался район, в котором следы разных эпох до сих пор встречаются на каждом шагу?
  - id: vanished
    title: Исчезнувшее
    image: vanished.jpg
    description: Здания, улицы и целые кварталы исчезают, но их историю можно восстановить по фотографиям, картам и документам. Исследуем причины сносов, судьбы архитектурных памятников и то, как утрата отдельных объектов меняла облик Москвы.
    cards:
      - topic: sukharev_tower
        title: Сухарева башня
        description: История одной из самых узнаваемых московских башен — от петровской эпохи до сноса в 1934 году.
      - topic: mokrinsky_lane
        title: Мокринский переулок
        description: Старая улица Зарядья, исчезнувшая при строительстве гостиницы «Россия». Каким был район до перестройки?
      - topic: red_gate
        title: Красные ворота
        description: История триумфальной арки, которая пережила несколько перестроек, но не сохранилась до наших дней.
  - id: archive
    title: Архив
    image: archive.jpg
    description: Что могут рассказать старые фотографии, документы и звуковые записи о жизни города? Изучаем архивные источники, сопоставляем свидетельства разных эпох и разбираемся, как по отдельным деталям восстановить историю московских мест.
    cards:
      - topic: sounds
        title: Звуки
        description: Звуковые записи возвращают атмосферу ушедших эпох и позволяют представить, как звучал город раньше.
      - topic: photography
        title: Москва в объективе
        description: Что можно узнать по старым снимкам о зданиях, улицах и повседневной жизни горожан. Учимся замечать детали, которые не видны с первого взгляда.
      - topic: maps
        title: Старые карты
        description: Исторические карты помогают проследить все перемены и увидеть, как город постепенно приобретал знакомый облик.

sections:
  - id: districts
    title: Районы
    intro: Исследуйте Москву через характер её районов.
    description: Узнавайте, как менялись улицы, жилые дома, дворы и общественные пространства — от исторической застройки до современных жилых массивов.
    cards:
      - title: Хамовники
        image: khamovniki.jpg
        alt: Панорама Хамовников
      - title: Чертаново
        image: chertanovo.jpg
        alt: Жилая застройка Чертанова
  - id: history
    title: Исторические события
    intro: Пройдите по местам, где разворачивались события, повлиявшие на жизнь Москвы.
    description: Архивные фотографии, документы и записи помогут увидеть сохранившиеся в современном городе следы прошлого.
    cards:
      - title: Пожар 1812
        image: fire-1812.jpg
        alt: Историческое изображение московского пожара 1812 года
      - title: Перемены 1917
        image: changes-1917.jpg
        alt: Историческое изображение событий 1917 года
  - id: residents
    title: Глазами жителей
    intro: Повседневные маршруты из жизни москвичей в разные эпохи.
    description: Дорога на работу, поход на рынок, прогулка во дворе или вечер в кино расскажут, как жили люди разных профессий и как менялся вокруг них город.
    cards:
      - title: Рабочий 1910
        image: worker-1910.jpg
        alt: Рабочие начала XX века
      - title: Библиотекарь 1980
        image: librarian-1980.jpg
        alt: Библиотека в 1980-е годы
